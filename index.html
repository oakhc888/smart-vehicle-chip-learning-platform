<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智慧車輛晶片概論｜學習平台</title>
  <style>
    :root{--ink:#102a43;--blue:#1677b8;--cyan:#70d6e8;--pale:#edf5f8;--muted:#547181;--line:#c9dbe2}*{box-sizing:border-box}body{margin:0;background:#f8fbfc;color:var(--ink);font-family:"Microsoft JhengHei",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{background:var(--ink);color:#fff;padding:20px 0}.brand{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand b{letter-spacing:.07em}.brand span{font-size:13px;color:#bfeaf4}.hero{padding:54px 0 32px;background:linear-gradient(135deg,#102a43,#174a6b);color:#fff}.eyebrow{letter-spacing:.13em;font-size:12px;color:#70d6e8;font-weight:bold}.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.18;margin:12px 0}.hero p{max-width:700px;line-height:1.8;color:#d7e8ef}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.stat{border:1px solid #426f89;padding:16px;background:#173b55}.stat b{font-size:28px;color:#70d6e8;display:block}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:32px 0 18px;flex-wrap:wrap}.toolbar h2{margin:0;font-size:25px}.toolbar input{padding:11px 14px;border:1px solid var(--line);border-radius:8px;width:260px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.week{background:#fff;border:1px solid var(--line);padding:18px;cursor:pointer;transition:.18s;min-height:206px}.week:hover,.week.active{border-color:var(--blue);box-shadow:0 7px 20px #1a577122}.num{font-size:12px;color:var(--blue);font-weight:bold;letter-spacing:.08em}.week h3{font-size:19px;margin:12px 0 6px;line-height:1.4}.en{font:14px Arial,sans-serif;color:var(--muted);line-height:1.4;min-height:38px}.meta{font-size:13px;margin-top:17px;color:var(--muted)}.detail{display:none;margin:30px 0 54px;background:#fff;border-top:4px solid var(--cyan);padding:28px}.detail.show{display:block}.detail h2{margin-top:0}.detail p{line-height:1.8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;background:var(--blue);padding:11px 16px;color:#fff;border-radius:6px;font:inherit;cursor:pointer}button.secondary{background:var(--pale);color:var(--ink);border:1px solid var(--line)}.assignment{margin-top:18px;padding:18px;background:var(--pale);border-left:4px solid var(--cyan)}.assignment small{display:block;color:var(--muted);margin-top:8px}footer{padding:28px 0;background:var(--ink);color:#d7e8ef;font-size:13px}.modal{position:fixed;inset:0;background:#102a43aa;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{background:white;padding:25px;max-width:520px;width:100%}.dialog h2{margin-top:0}.dialog input{width:100%;padding:10px;border:1px solid var(--line);margin:8px 0 16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.brand{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><div class="wrap brand"><b>CHIPSTUDIO · SMART VEHICLE</b><span>115-1 智慧車輛晶片概論｜18 WEEKS / 54 HOURS</span></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">COURSE LEARNING PLATFORM</div><h1>從晶片製造到車用供應鏈，<br>建立智慧車輛的完整視角。</h1><p>由校內與業界師資共同授課。每週 3 小時，結合核心概念、產業案例、分組活動與作業回饋。</p><div class="stats"><div class="stat"><b>18</b>週次教材</div><div class="stat"><b>54</b>總授課時數</div><div class="stat"><b>09:00–12:00</b>每週五上午</div></div></div></section>
<main class="wrap"><div class="toolbar"><h2>每週教材與作業</h2><input id="search" placeholder="搜尋主題或授課教師"></div><section id="weeks" class="grid" aria-label="18週課程"></section><section id="detail" class="detail" aria-live="polite"></section></main>
<footer><div class="wrap">智慧車輛晶片概論 · Introduction to Smart Vehicle Chips · 學習平台首頁原型</div></footer>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><h2>作業繳交示範</h2><p id="modalTitle"></p><input type="file" aria-label="選擇作業檔案"><div class="actions"><button id="submit">標示為已繳交</button><button class="secondary" id="close">取消</button></div><small>此為首頁原型；檔案僅在瀏覽器本機模擬狀態，尚未上傳至伺服器。</small></div></div>
<script>
const data=[
['智慧晶片製造設備概論','Smart Chip Manufacturing Equipment','高誌鴻'],['車用晶片概論（一）','Automotive Semiconductor Fundamentals I','侯光煦'],['車用晶片概論（二）','Automotive Semiconductor Fundamentals II','侯光煦'],['兩岸電動車發展狀況','Cross-strait EV Development','陳建中'],['車用晶片產業人才需求','Automotive Chip Talent Demand','周海筠'],['半導體製造簡介（一）','Semiconductor Manufacturing I','施信華'],['半導體製造簡介（二）','Semiconductor Manufacturing II','施信華'],['晶圓廠／代工介紹（一）','Foundry Operations I','林琨鋒'],['晶圓廠／代工介紹（二）','Foundry Operations II','林琨鋒'],['晶圓廠／代工介紹（三）','Foundry Operations III','林琨鋒'],['台灣半導體產業優劣勢','Taiwan Semiconductor Industry','高誌鴻'],['產業結構','Semiconductor Industry Structure','胡永賢'],['封裝技術概論與製程技術介紹（一）','Packaging Fundamentals I','蘇家慷'],['封裝技術概論與製程技術介紹（二）','Packaging Fundamentals II','蘇家慷'],['封裝與製程技術未來發展趨勢（一）','Future Packaging Trends I','張玳寧'],['封裝與製程技術未來發展趨勢（二）','Future Packaging Trends II','張玳寧'],['智財權','Intellectual Property Rights','莊桓佳'],['供應鏈概論','Supply Chain Fundamentals','林琨鋒']];
const start=new Date('2026-09-11T09:00:00+08:00');const rescheduled={2:['2026-09-18T13:10:00+08:00','13:10–16:00'],4:['2026-10-02T13:10:00+08:00','13:10–16:00'],15:['2026-12-18T13:10:00+08:00','13:10–16:00'],16:['2026-12-11T13:10:00+08:00','13:10–16:00']};let selected=0;const weeks=document.querySelector('#weeks'),detail=document.querySelector('#detail');
function slotFor(i){if(rescheduled[i])return rescheduled[i];const d=new Date(start);d.setDate(d.getDate()+i*7);return [d.toISOString(),'09:00–12:00']}
function dateFor(i){return new Date(slotFor(i)[0]).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}
function render(q=''){weeks.innerHTML='';data.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).forEach(([zh,en,t])=>{const n=data.findIndex(x=>x[0]===zh),slot=slotFor(n);const el=document.createElement('article');el.className='week'+(n===selected?' active':'');el.tabIndex=0;el.innerHTML=`<div class="num">WEEK ${String(n+1).padStart(2,'0')}</div><h3>${zh}</h3><div class="en">${en}</div><div class="meta">授課教師：${t}<br>${dateFor(n)} · ${slot[1]}（3 小時）</div>`;el.onclick=()=>show(n);el.onkeydown=e=>{if(e.key==='Enter')show(n)};weeks.append(el)})}
function show(i){selected=i;const [zh,en,t]=data[i],slot=slotFor(i);detail.classList.add('show');detail.innerHTML=`<div class="num">WEEK ${String(i+1).padStart(2,'0')} · ${dateFor(i)}</div><h2>${zh}</h2><div class="en">${en}</div><p><b>授課教師：</b>${t}　｜　<b>課程時間：</b>${slot[1]}（3 小時）</p><p>本週教材包含：學習目標、核心概念、產業案例、課堂活動、討論反思與重點回顧。</p><div class="actions"><button class="secondary" onclick="alert('原型示範：正式網站可連結至本週 PPT、講義或影音教材。')">瀏覽本週教材</button><button onclick="openSubmit(${i})">繳交本週作業</button></div><div class="assignment"><b>作業建議</b><br>完成本週案例分析或小組活動產出，依教師指示上傳。<small>目前狀態：<span id="status">尚未繳交</span></small></div>`;render(document.querySelector('#search').value);detail.scrollIntoView({behavior:'smooth',block:'nearest'})}
function openSubmit(i){document.querySelector('#modalTitle').textContent=`W${String(i+1).padStart(2,'0')}｜${data[i][0]}`;document.querySelector('#modal').classList.add('show')};window.openSubmit=openSubmit;
document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('show');document.querySelector('#submit').onclick=()=>{document.querySelector('#modal').classList.remove('show');const s=document.querySelector('#status');if(s)s.textContent='已於本機標示為繳交';};document.querySelector('#search').oninput=e=>render(e.target.value);render();show(0);
</script></body></html>
